<style>

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:var(--font-ui)}
body{background-image:linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.01) 1px,transparent 1px);background-size:24px 24px}
button,input,select{font:inherit}
button{color:var(--fg);background:#0c100c;border:1px solid var(--line);border-radius:0;cursor:pointer}

.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
@media(prefers-reduced-motion:reduce){.check.run .box{animation:none}}
.boot{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:24px;font-family:var(--font-data);font-size:12px;color:var(--accent);cursor:pointer}

 <div class="screen-head"><div><div class="eyebrow">01 // FIELD OVERVIEW</div><h1>RESPONSE MAP</h1><div class="sub">COUNTRY → ADMINISTRATIVE REGION → CITY → ECTO GRID → INVESTIGATION SITE</div></div><div class="status"><i class="lamp"></i>LOCAL NETWORK // READY</div></div>
 <div class="notice">ECTO GRID REFERENCES are operational identifiers. The map is regional and does not represent street-level navigation. Squares mark response sectors; diamonds mark UK franchises; dashed rings mark county-wide franchises with no exact location.</div>
 <div class="grid">
  <section class="card"><h2>UK RESPONSE GRID <span class="panel-code">REGIONAL VIEW</span></h2><div class="map" id="map"><div class="mapframe" id="mapframe"></div></div></section>
  <aside>
   <section class="card"><h2>SELECTED LOCATION</h2><div class="readout" id="loc"></div><div class="actions"><button class="action btn-primary" onclick="setRoute('dispatch')">ECTO DISPATCH</button><button class="action" onclick="renderMap()">VIEW SITES</button></div></section>
   <section class="card" style="margin-top:12px"><h2>FRANCHISE FINDER <span class="panel-code">${franchises.length} LISTED</span></h2>${finderHTML()}</section>
   <section class="card" style="margin-top:12px"><h2>ACTIVE CASE</h2><div class="readout">CASE // SE-0261<br>TYPE // AWE<br>STATUS // ACTIVE INVESTIGATION<br>DATE // 24/09/2026</div></section>
  </aside>
 </div>`;
 const map=document.getElementById("mapframe");
 map.innerHTML='<svg viewBox="0 0 '+MAPW+" "+MAPH+'" aria-hidden="true"><path class="land" d="'+poly(GB)+'"/><path class="land" d="'+poly(NI)+'"/></svg>';
 locations.forEach(l=>{
   const b=document.createElement("button");
   b.className="marker "+(l.risk==="CRITICAL"?"alert":l.status==="MONITOR"?"monitor":"active");
   const [px,py]=proj(l.lat,l.lon);b.style.left=(px/MAPW*100)+"%";b.style.top=(py/MAPH*100)+"%";
   b.innerHTML='<div class="ring"></div><div class="dot"></div><span>'+l.city+'</span>';
   b.onclick=()=>{selected=l;renderMap()};
   map.appendChild(b);
 });
 franchises.forEach((f,n)=>{
   const b=document.createElement("button");
   const near=locations.some(l=>Math.abs(l.lat-f.lat)<.12&&Math.abs(l.lon-f.lon)<.12);
   b.className="fr"+(f.wide?" wide":"")+(near?" near":"")+(selFr===f?" sel":"")+(frMatch(f)?"":" dim");
   const [px,py]=proj(f.lat,f.lon);b.style.left=(px/MAPW*100)+"%";b.style.top=(py/MAPH*100)+"%";
   b.setAttribute("aria-label","Franchise: "+f.name+(f.wide?" (county-wide, approximate position)":""));
   b.innerHTML='<i></i><span class="tag">'+f.name.toUpperCase()+(f.wide?" // COUNTY-WIDE":"")+'</span>';
   b.onclick=()=>pickFranchise(n);
   map.appendChild(b);
 });
 document.getElementById("loc").innerHTML=
 `<div class="kv"><span class="k">LOCATION ID</span><span class="v">${selected.id}</span></div>
  <div class="kv"><span class="k">COUNTRY</span><span class="v">${selected.country}</span></div>
  <div class="kv"><span class="k">REGION</span><span class="v">${selected.region}</span></div>
  <div class="kv"><span class="k">CITY</span><span class="v">${selected.city}</span></div>
  <div class="kv"><span class="k">ECTO GRID</span><span class="v">${selected.grid}</span></div>
  <div class="kv"><span class="k">SITE</span><span class="v">${selected.site}</span></div>
  <div class="kv"><span class="k">RISK</span><span class="v">${selected.risk}</span></div>`;
}

const frMatch=f=>(!fnd.country||f.country===fnd.country)&&(!fnd.county||f.county===fnd.county);
function pickFranchise(n){selFr=franchises[n];fnd={country:selFr.country,county:selFr.county};renderMap()}
function frNav(level,val){
 if(level===0){fnd={country:null,county:null};selFr=null}
 else if(level===1){fnd={country:val||fnd.country,county:null};selFr=null}
 else if(level===2){fnd.county=val||fnd.county;selFr=null}
 renderMap();
}
function finderHTML(){
 const crumbs='<div class="crumbs"><button class="crumb" onclick="frNav(0)">UK</button>'+(fnd.country?' › <button class="crumb" onclick="frNav(1)">'+fnd.country.toUpperCase()+'</button>':"")+(fnd.county?' › <button class="crumb" onclick="frNav(2)">'+fnd.county.toUpperCase()+'</button>':"")+'</div>';
 let list,info="";
 if(!fnd.country){
  list=countries.map(c=>{const n=franchises.filter(f=>f.country===c).length;return `<button ${n?"":"disabled"} onclick="frNav(1,'${c}')">${c.toUpperCase()}<small>${n} ${n===1?"FRANCHISE":"FRANCHISES"}</small></button>`}).join("");
 }else if(!fnd.county){
  const cs=[...new Set(franchises.filter(f=>f.country===fnd.country).map(f=>f.county))].sort();
  list=cs.map(c=>{const n=franchises.filter(f=>f.country===fnd.country&&f.county===c).length;return `<button onclick="frNav(2,'${c}')">${c.toUpperCase()}<small>${n}</small></button>`}).join("");
 }else{
  list=franchises.map((f,n)=>[f,n]).filter(([f])=>frMatch(f)).map(([f,n])=>`<button class="${selFr===f?"sel":""}" onclick="pickFranchise(${n})">${f.name.toUpperCase()}<small>${f.wide?"COUNTY-WIDE":"LOCAL"}</small></button>`).join("");
 }
 if(selFr)info=`<div class="readout"><div class="kv"><span class="k">FRANCHISE</span><span class="v">${selFr.name.toUpperCase()}</span></div><div class="kv"><span class="k">COUNTRY</span><span class="v">${selFr.country.toUpperCase()}</span></div><div class="kv"><span class="k">COUNTY</span><span class="v">${selFr.county.toUpperCase()}</span></div><div class="kv"><span class="k">COVERAGE</span><span class="v">${selFr.wide?"COUNTY-WIDE":"LOCAL"}</span></div><div class="kv"><span class="k">MAP POSITION</span><span class="v">${selFr.wide?"APPROX. CENTRE (RING)":"TOWN / CITY CENTRE"}</span></div></div>`;
 return crumbs+info+'<div class="frlist">'+list+'</div>';
}

function renderDispatch(){
 document.getElementById("screen").innerHTML=`
 <div class="screen-head"><div><div class="eyebrow">02 // OPERATIONS</div><h1>ECTO DISPATCH</h1><div class="sub">SELECT TEAM → SELECT VEHICLE → PROCEED TO PRE-FLIGHT</div></div></div>
 <div class="grid">
  <section class="card"><h2>INCOMING CASE</h2><div class="readout">
   <div class="kv"><span class="k">CASE</span><span class="v">SE-0261</span></div>
   <div class="kv"><span class="k">LOCATION</span><span class="v">${selected.city}, ${selected.region}</span></div>
   <div class="kv"><span class="k">SITE</span><span class="v">${selected.site}</span></div>
   <div class="kv"><span class="k">ECTO GRID</span><span class="v">${selected.grid}</span></div>
   <div class="kv"><span class="k">TYPE</span><span class="v">AWE</span></div>
  </div></section>
  <aside class="card"><h2>DEPLOYMENT SELECTION</h2>
   <div class="field"><label>RESPONSE TEAM</label><select id="teamSelect">${teams.map(t=>`<option value="${t.id}" ${t.status!=="AVAILABLE"?"disabled":""}>${t.id} // ${t.name} // ${t.status}</option>`).join("")}</select></div>
   <div class="field"><label>VEHICLE</label><select id="vehicleSelect"><option>ECTO-04 // AVAILABLE</option><option>ECTO-02 // AVAILABLE</option><option>ECTO-06 // STANDBY</option></select></div>
   <button class="action btn-primary" style="width:100%;margin-top:10px" onclick="proceedPreflight()">PROCEED TO PRE-FLIGHT</button>
  </aside>
 </div>`;
}

function proceedPreflight(){
 const t=document.getElementById("teamSelect"),v=document.getElementById("vehicleSelect");
 const team=teams.find(x=>x.id===t.value);
 if(!team||team.status!=="AVAILABLE"){sfx.deny();openDialog(`<h2>NO TEAM SELECTED</h2><div class="msg">SELECT AN AVAILABLE RESPONSE TEAM TO CONTINUE.</div><div class="btn-row"><button class="action btn-primary" onclick="closeDialog()">OK</button></div>`);return}
 deployment={team,vehicle:v.value.split(" // ")[0],vehicleStatus:v.value.split(" // ")[1]||"",location:selected};
 sfx.confirm();setRoute("preflight");
}

const checks=[
 ["CREW MANIFEST","ALL ABOARD"],
 ["PROTON PACK CHARGE","NOMINAL"],
 ["PARTICLE THROWER","NOMINAL"],
 ["TRAP INVENTORY","4 OF 4 LOADED"],
 ["PKE SCANNER","CALIBRATED"],
 ["VEHICLE SYSTEMS","NOMINAL"],
 ["COMMS LINK","ESTABLISHED"],
 ["ROUTE TO SITE","LOADED"]
];
function renderPreflight(){
 const screen=document.getElementById("screen");
 if(!deployment){
  screen.innerHTML=`<div class="screen-head"><div><div class="eyebrow">03 // OPERATIONS</div><h1>PRE-FLIGHT</h1><div class="sub">NO DEPLOYMENT LOADED</div></div></div>
  <div class="notice">Select a response team and vehicle on Ecto Dispatch before starting pre-flight checks.</div>
  <button class="action btn-primary" onclick="setRoute('dispatch')">GO TO ECTO DISPATCH</button>`;
  return;
 }
 const d=deployment;
 screen.innerHTML=`
 <div class="screen-head"><div><div class="eyebrow">03 // OPERATIONS</div><h1>PRE-FLIGHT</h1><div class="sub">SYSTEMS CHECK → LAUNCH AUTHORISATION</div></div><div class="status"><i class="lamp warn" id="pfLamp"></i><span id="pfState">CHECKING</span></div></div>
 <div class="grid">
  <section class="card"><h2>SYSTEMS CHECK <span class="panel-code" id="pfCount">0 / ${checks.length}</span></h2>
   <div class="bar"><i id="pfBar"></i></div>
   <div id="pfList">${checks.map((c,i)=>`<div class="check" id="chk${i}"><i class="box"></i><span>${c[0]}</span><span class="res">WAITING</span></div>`).join("")}</div>
  </section>
  <aside>
   <section class="card"><h2>DEPLOYMENT</h2><div class="readout">
    <div class="kv"><span class="k">CASE</span><span class="v">SE-0261 // AWE</span></div>
    <div class="kv"><span class="k">SITE</span><span class="v">${d.location.site}</span></div>
    <div class="kv"><span class="k">CITY</span><span class="v">${d.location.city}, ${d.location.region}</span></div>
    <div class="kv"><span class="k">ECTO GRID</span><span class="v">${d.location.grid}</span></div>
    <div class="kv"><span class="k">TEAM</span><span class="v">${d.team.id} // ${d.team.name}</span></div>
    <div class="kv"><span class="k">CREW</span><span class="v">${d.team.crew}</span></div>
    <div class="kv"><span class="k">VEHICLE</span><span class="v">${d.vehicle} // ${d.vehicleStatus}</span></div>
   </div>
   <div class="btn-row"><button class="action" onclick="setRoute('dispatch')">BACK TO DISPATCH</button><button class="action btn-primary" id="launchBtn" disabled onclick="launch()">LAUNCH</button></div>
   </section>
   <section class="card" style="margin-top:12px" id="pfMsg"><h2>STATUS</h2><div class="readout">CHECKS IN PROGRESS. LAUNCH LOCKED.</div></section>
  </aside>
 </div>`;
 let i=0;
 const step=()=>{
  if(i>0){const prev=document.getElementById("chk"+(i-1));prev.className="check ok";prev.querySelector(".res").textContent=checks[i-1][1];sfx.tick();}
  document.getElementById("pfBar").style.width=(i/checks.length*100)+"%";
  document.getElementById("pfCount").textContent=i+" / "+checks.length;
  if(i>=checks.length){
   document.getElementById("pfLamp").className="lamp";
   document.getElementById("pfState").textContent="READY";
   document.getElementById("launchBtn").disabled=false;sfx.confirm();
   document.querySelector("#pfMsg .readout").innerHTML="ALL SYSTEMS NOMINAL.<br>LAUNCH AUTHORISED.";
   return;
  }
  const row=document.getElementById("chk"+i);
  row.className="check run";row.querySelector(".res").textContent="CHECKING";
  i++;pfTimer=setTimeout(step,450+Math.random()*350);
 };
 step();
}
function launch(){
 sfx.chirp();
 document.getElementById("launchBtn").disabled=true;
 document.getElementById("pfState").textContent="LAUNCHED";
 document.querySelector("#pfMsg .readout").innerHTML="LAUNCH CONFIRMED // "+deployment.team.id+"<br>VEHICLE "+deployment.vehicle+" EN ROUTE TO "+deployment.location.city.toUpperCase()+"<br><br>NEXT SCREEN NOT YET BUILT.";
}

function renderConfig(){
 const p=profile;
 document.getElementById("screen").innerHTML=`
 <div class="screen-head"><div><div class="eyebrow">07 // SYSTEM CONTROL</div><h1>CONFIGURATION</h1><div class="sub">DISPLAY PROFILE // OPERATIONAL RESOURCES // LOCAL SETTINGS</div></div></div>
 <section class="card">
  <h2>DISPLAY PROFILE <span class="panel-code">PRIMARY INTERFACE LANGUAGE</span></h2>
  <div class="notice"><b>CASSETTE FUTURISM</b> is the ECTO OS primary visual identity. Alternate profiles change presentation only; they do not replace the core ECTO interface language.</div>
  <div class="profile-grid">
   ${Object.entries(profiles).map(([id,x])=>`<button class="profile ${id} ${p===id?'selected':''}" onclick="applyProfile('${id}')"><i class="sample"></i><strong>${x.label}</strong><span>${id==="cassette"?"PRIMARY // RETROACTIVE MODERNISM":id==="phosphor"?"GREEN CRT // OPTIONAL":"OPTIONAL DISPLAY PROFILE"}</span></button>`).join("")}
  </div>
 </section>
 <div class="grid" style="margin-top:12px">
  <section class="card"><h2>RESPONSE TEAM MANAGEMENT <span class="panel-code">LOCAL REGISTER</span></h2>
   <table class="team-table"><thead><tr><th>ID</th><th>NAME</th><th>CREW</th><th>STATUS</th><th></th></tr></thead><tbody>
   ${teams.map((t,i)=>`<tr><td>${t.id}</td><td>${t.name}</td><td>${t.crew}</td><td>${t.status}</td><td><div class="team-actions"><button class="mini" onclick="editTeam(${i})">EDIT</button><button class="mini" onclick="deleteTeam(${i})">DELETE</button></div></td></tr>`).join("")}
   </tbody></table>
   <hr><button class="action btn-primary" onclick="newTeam()">+ NEW TEAM</button>
  </section>
  <aside class="card"><h2>DISPLAY STATE</h2><div class="readout">
   ACTIVE PROFILE // ${profiles[p].label}<br>
   STORAGE // LOCAL<br>
   UI LANGUAGE // EUROSTILE<br>
   DATA / TELEMETRY // COURIER<br>
   CRT EFFECT // RESTRAINED<br>
   VISUAL NOISE // LOW
  </div></aside>
 </div>`;
}
const statuses=["AVAILABLE","STANDBY","DEPLOYED","EN ROUTE","INVESTIGATING","RETURNING","OFFLINE"];
let lastFocus=null;
function closeDialog(){
 const m=document.getElementById("modal");if(m)m.remove();
 document.removeEventListener("keydown",dialogKeys);
 if(lastFocus&&document.contains(lastFocus))lastFocus.focus();
}
function dialogKeys(e){
 if(e.key==="Escape"){closeDialog();return}
 if(e.key!=="Tab")return;
 const f=[...document.querySelectorAll("#modal input,#modal select,#modal button")].filter(x=>!x.disabled);
 if(!f.length)return;
 const first=f[0],last=f[f.length-1];
 if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
 else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
}
function openDialog(html){
 closeDialog();
 lastFocus=document.activeElement;
 const m=document.createElement("div");
 m.className="modal";m.id="modal";
 m.innerHTML='<div class="dialog" role="dialog" aria-modal="true">'+html+'</div>';
 m.addEventListener("mousedown",e=>{if(e.target===m)closeDialog()});
 document.body.appendChild(m);
 document.addEventListener("keydown",dialogKeys);
 const first=m.querySelector("input,select,button");if(first)first.focus();
}
function newTeam(){editTeam(-1)}
function editTeam(i){
 const t=i<0?{id:"",name:"",crew:6,status:"AVAILABLE"}:teams[i];
 openDialog(`
  <h2>${i<0?"NEW RESPONSE TEAM":"EDIT TEAM // "+t.id}</h2>
  <div class="err" id="teamErr" role="alert" hidden></div>
  <div class="field"><label for="tId">TEAM ID / CALLSIGN</label><input id="tId" maxlength="16" autocomplete="off" value="${t.id}"></div>
  <div class="field"><label for="tName">TEAM NAME</label><input id="tName" maxlength="32" autocomplete="off" value="${t.name}"></div>
  <div class="form-grid">
   <div class="field"><label for="tCrew">CREW SIZE</label><input id="tCrew" type="number" min="1" max="99" value="${t.crew}"></div>
   <div class="field"><label for="tStatus">STATUS</label><select id="tStatus">${statuses.map(x=>`<option ${x===t.status?"selected":""}>${x}</option>`).join("")}</select></div>
  </div>
  <div class="btn-row"><button class="action" onclick="closeDialog()">CANCEL</button><button class="action btn-primary" onclick="saveTeam(${i})">SAVE TEAM</button></div>`);
}
function saveTeam(i){
 const id=document.getElementById("tId").value.trim().toUpperCase();
 const name=document.getElementById("tName").value.trim().toUpperCase();
 const crew=parseInt(document.getElementById("tCrew").value);
 const status=document.getElementById("tStatus").value;
 const err=document.getElementById("teamErr");
 const fail=m=>{sfx.deny();err.textContent=m;err.hidden=false};
 if(!id)return fail("TEAM ID IS REQUIRED.");
 if(!name)return fail("TEAM NAME IS REQUIRED.");
 if(!(crew>=1))return fail("CREW SIZE MUST BE AT LEAST 1.");
 if(teams.some((x,n)=>n!==i&&x.id.toUpperCase()===id))return fail("TEAM ID "+id+" IS ALREADY IN USE.");
 const rec={id,name,crew,status};
 if(i<0)teams.push(rec);else teams[i]=rec;
 sfx.confirm();saveTeams();closeDialog();renderConfig();
}
function deleteTeam(i){
 const t=teams[i];
 if(!["AVAILABLE","STANDBY","OFFLINE"].includes(t.status)){
  sfx.deny();openDialog(`<h2>CANNOT DELETE // ${t.id}</h2><div class="msg">${t.id} IS ${t.status}.<br>ACTIVE DEPLOYMENTS CANNOT BE DELETED.</div><div class="btn-row"><button class="action btn-primary" onclick="closeDialog()">OK</button></div>`);
  return;
 }
 openDialog(`<h2>DELETE TEAM // ${t.id}</h2><div class="msg">${t.id} // ${t.name}<br>THIS REMOVES THE TEAM FROM THE LOCAL REGISTER.</div><div class="btn-row"><button class="action" onclick="closeDialog()">CANCEL</button><button class="action btn-danger" onclick="confirmDelete(${i})">DELETE TEAM</button></div>`);
}
function confirmDelete(i){
 sfx.confirm();teams.splice(i,1);saveTeams();closeDialog();renderConfig();
}
function render(){document.getElementById("profileStatus").textContent=profiles[profile].label;document.getElementById("footerState").textContent="LOCAL DISPLAY PROFILE // "+profiles[profile].label;renderConfig()}
function bootSequence(){
 const boot=document.getElementById("boot"),txt=document.getElementById("bootText"),prompt=document.getElementById("bootPrompt");
 const lines=["ECTO OS // FIELD OPERATIONS SYSTEM","MEMORY CHECK ............ OK","DISPLAY PROFILE ......... "+profiles[profile].label,"RESPONSE GRID ........... LOADED","TEAM REGISTER ........... "+teams.length+" TEAMS","LOCAL STORAGE ........... OK","","SYSTEM OPERATIONAL"];
 const slow=!matchMedia("(prefers-reduced-motion:reduce)").matches;
 let started=false,skip=false,done=false;
 function finish(){if(done)return;done=true;document.removeEventListener("keydown",go);boot.removeEventListener("pointerdown",go);sfx.chirp();boot.classList.add("out");setTimeout(()=>boot.remove(),slow?450:0)}
 function go(e){
  if(started){skip=true;return}
  started=true;ac();prompt.remove();
  let n=0;
  (function next(){
   if(skip||n>=lines.length){txt.textContent=lines.join("\n");setTimeout(finish,skip?0:350);return}
   txt.textContent=lines.slice(0,++n).join("\n");
   if(lines[n-1])sfx.tick();
   setTimeout(next,slow?230:30);
  })();
 }
 document.addEventListener("keydown",go);boot.addEventListener("pointerdown",go);
}
bootSequence();
Object.assign(window,{pickFranchise,frNav,setRoute,renderMap,applyProfile,newTeam,editTeam,deleteTeam,saveTeam,confirmDelete,closeDialog,proceedPreflight,launch});
setRoute("map");
})();
</script>
