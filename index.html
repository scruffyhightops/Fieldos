function saveFranchise(i){
 const v=id=>document.getElementById(id).value.trim(),err=document.getElementById("frErr");
 const fail=m=>{sfx.deny();err.textContent=m;err.hidden=false};
 const name=v("fName"),county=v("fCounty"),lat=parseFloat(v("fLat")),lon=parseFloat(v("fLon"));
 if(!name)return fail("FRANCHISE NAME IS REQUIRED.");
 if(franchises.some((x,n)=>n!==i&&x.name.toUpperCase()===name.toUpperCase()))return fail("A FRANCHISE NAMED "+name.toUpperCase()+" ALREADY EXISTS.");
 if(!county)return fail("COUNTY IS REQUIRED.");
 if(!(lat>=49.8&&lat<=59&&lon>=-8.5&&lon<=2))return fail("ENTER A UK LATITUDE AND LONGITUDE, E.G. 51.35 AND -1.99. OR PICK A SECTOR UNDER MAP POSITION.");
 const vehicles=v("fVeh").split("\n").map(x=>x.trim()).filter(Boolean).map(l=>{const k=l.indexOf("//");return k<0?{name:l,type:""}:{name:l.slice(0,k).trim(),type:l.slice(k+2).trim()}});

 if(i<0)franchises.push(rec);else franchises[i]=rec;
 saveFranchises();selFr=rec;fnd={country:rec.country,county:rec.county};
 sfx.confirm();closeDialog();renderMap();
}

  if(i>=checks.length){
   document.getElementById("pfLamp").className="lamp";
   document.getElementById("pfState").textContent="READY";
   document.getElementById("launchBtn").disabled=false;sfx.confirm();
   document.querySelector("#pfMsg .readout").innerHTML="ALL SYSTEMS NOMINAL.<br>LAUNCH AUTHORISED.";
   return;
  }
  const row=document.getElementById("chk"+i);
  row.className="check run";row.querySelector(".res").textContent="CHECKING";
  i++;pfTimer=setTimeout(step,450+Math.random()*350);
 };
 step();
}
function launch(){
 const d=deployment;if(!d||d.phase!=="PREFLIGHT")return;
 sfx.chirp();
 Object.assign(d,{phase:"ENROUTE",caseId:caseId(),enrouteStart:Date.now(),log:[],stats:{traps:0,scans:0,backup:false,peak:0,contained:false},pke:20+Math.random()*10,arrived:false});
 setTeamStatus("EN ROUTE");
 setRoute("enroute");
}

const ENROUTE_MS=30000,RETURN_MS=10000;
const phaseRoute={PREFLIGHT:"preflight",ENROUTE:"enroute",ONSITE:"onsite",REPORT:"report"};
const phaseLabel={PREFLIGHT:"PRE-FLIGHT",ENROUTE:"EN ROUTE",ONSITE:"ON SITE",REPORT:"RETURNING"};
const caseNo=()=>parseInt(localStorage.getItem("ectoCaseNo")||"261");
const caseId=()=>"SE-"+String(caseNo()).padStart(4,"0");
const fmt=ms=>{const s=Math.max(0,Math.round(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const caseLog=()=>{try{return JSON.parse(localStorage.getItem("ectoCaseLog")||"[]")}catch(e){return[]}};
const hdr=(n,t,sub,right)=>`<div class="screen-head"><div><div class="eyebrow">${n} // OPERATIONS</div><h1>${t}</h1><div class="sub">${sub}</div></div>${right||""}</div>`;
const missionKV=d=>[["CASE",d.caseId||caseId()],["SITE",d.location.site],["GRID",d.location.grid],["TEAM",d.team.id+" // "+d.team.name],["VEHICLE",d.vehicle]].map(([k,v])=>`<div class="kv"><span class="k">${k}</span><span class="v">${esc(v)}</span></div>`).join("");
function gate(phase,n,title){
 if(deployment&&deployment.phase===phase)return true;
 const cur=deployment?phaseRoute[deployment.phase]:"dispatch";
 document.getElementById("screen").innerHTML=hdr(n,title,deployment?"MISSION IN ANOTHER PHASE":"NO ACTIVE MISSION")+`<div class="notice">${deployment?"The active mission is at "+phaseLabel[deployment.phase]+".":"Select a response team and vehicle on Ecto Dispatch to start a mission."}</div><button class="action btn-primary" onclick="setRoute('${cur}')">${deployment?"GO TO "+phaseLabel[deployment.phase]:"GO TO ECTO DISPATCH"}</button>`;
 return false;
}
function setTeamStatus(st){if(!deployment)return;const t=teams.find(x=>x.id===deployment.team.id);if(t){t.status=st;saveTeams()}}
function addLog(msg){const d=deployment;d.log.push({t:Date.now()-(d.onsiteStart||d.enrouteStart),msg})}

/* 04 EN ROUTE */
function renderEnroute(){
 if(!gate("ENROUTE","04","EN ROUTE"))return;
 const d=deployment;
 document.getElementById("screen").innerHTML=hdr("04","EN ROUTE","TRAVEL TO SITE → ARRIVAL",'<div class="status"><i class="lamp warn" id="enLamp"></i><span id="enState">IN TRANSIT</span></div>')+`
 <div class="grid"><section class="card"><h2>JOURNEY <span class="panel-code">SIMULATED</span></h2>
  <div class="readout" style="font-size:30px;letter-spacing:.12em" id="etaBig">--:--</div><div class="sub">TIME TO ARRIVAL</div>
  <div class="bar"><i id="enBar"></i></div><div class="readout" id="enPct">0%</div><hr><div class="readout" id="enLog"></div></section>
 <aside><section class="card"><h2>MISSION</h2><div class="readout">${missionKV(d)}</div>
  <div class="btn-row"><button class="action" onclick="abortMission()">ABORT</button><button class="action btn-primary" id="beginBtn" disabled onclick="beginInvestigation()">BEGIN</button></div>
  <button class="action" style="width:100%;margin-top:7px" onclick="skipTravel()">SKIP TO ARRIVAL</button></section></aside></div>`;
 const steps=[[0,"VEHICLE DEPARTED BASE"],[.25,"ROUTE CLEAR // PKE TELEMETRY RELAYED"],[.5,"HALFWAY // COMMS NOMINAL"],[.8,"APPROACHING ECTO GRID "+d.location.grid],[1,"ARRIVED // "+d.location.site.toUpperCase()]];
 let shown=0;
 const tick=quiet=>{
  const el=Date.now()-d.enrouteStart,p=Math.min(1,el/ENROUTE_MS);
  document.getElementById("enBar").style.width=(p*100)+"%";
  document.getElementById("enPct").textContent=Math.round(p*100)+"%";
  document.getElementById("etaBig").textContent=fmt(ENROUTE_MS-el);
  const due=steps.filter(x=>p>=x[0]);
  if(due.length>shown){
   document.getElementById("enLog").innerHTML=due.map(x=>`<div>${fmt(x[0]*ENROUTE_MS)} // ${x[1]}</div>`).reverse().join("");
   if(!quiet)sfx.tick();shown=due.length;
  }
  if(p>=1){
   clearInterval(mTimer);
   if(!d.arrived){d.arrived=true;if(!quiet)sfx.chirp()}
   document.getElementById("enLamp").className="lamp";document.getElementById("enState").textContent="ARRIVED";
   document.getElementById("beginBtn").disabled=false;
  }
 };
 d.tickEn=()=>tick(false);
 tick(true);mTimer=setInterval(()=>tick(false),250);
}
function skipTravel(){if(deployment&&deployment.phase==="ENROUTE"){deployment.enrouteStart=Date.now()-ENROUTE_MS;deployment.tickEn&&deployment.tickEn()}}
function abortMission(){
 const d=deployment;if(!d)return;
 openDialog(`<h2>ABORT MISSION // ${esc(d.caseId||caseId())}</h2><div class="msg">${esc(d.team.id)} RETURNS TO AVAILABLE.<br>NO CASE RECORD IS SAVED.</div><div class="btn-row"><button class="action" onclick="closeDialog()">CANCEL</button><button class="action btn-danger" onclick="confirmAbort()">ABORT MISSION</button></div>`);
}
function confirmAbort(){setTeamStatus("AVAILABLE");deployment=null;sfx.deny();closeDialog();setRoute("dispatch")}
function beginInvestigation(){
 const d=deployment;if(!d||d.phase!=="ENROUTE")return;
 d.travelMs=Math.min(Date.now()-d.enrouteStart,ENROUTE_MS);
 d.phase="ONSITE";d.onsiteStart=Date.now();d.log=[];
 addLog("TEAM ON SITE // INVESTIGATION STARTED");
 setTeamStatus("INVESTIGATING");sfx.confirm();setRoute("onsite");
}

/* 05 ON SITE */
const pkeLevel=v=>v<15?"CLEAR":v<35?"LOW":v<60?"MODERATE":v<80?"HIGH":"CRITICAL";
function renderOnsite(){
 if(!gate("ONSITE","05","ON SITE"))return;
 const d=deployment;
 document.getElementById("screen").innerHTML=hdr("05","ON SITE","SCAN → TRAP → CONCLUDE",'<div class="status"><i class="lamp warn" id="osLamp"></i><span id="osState">INVESTIGATING</span></div>')+`
 <div class="grid"><section class="card"><h2>PKE READING <span class="panel-code" id="pkeLvl"></span></h2>
  <div class="cells" id="pkeCells">${"<i></i>".repeat(20)}</div><div class="readout" id="pkeVal" style="margin-top:6px"></div>
  <div class="actions"><button class="action" onclick="scanArea()">SCAN AREA</button><button class="action" id="trapBtn" onclick="deployTrap()"></button><button class="action" id="bkBtn" onclick="requestBackup()">REQUEST BACKUP</button><button class="action btn-primary" onclick="concludeInvestigation()">CONCLUDE</button></div>
  <hr><div class="readout" id="osLog"></div></section>
 <aside><section class="card"><h2>MISSION</h2><div class="readout">${missionKV(d)}<div class="kv"><span class="k">ENTITY</span><span class="v" id="osEnt"></span></div><div class="kv"><span class="k">SCANS</span><span class="v" id="osScans"></span></div></div></section></aside></div>`;
 refreshOnsite();
 mTimer=setInterval(()=>{
  if(d.stats.contained)d.pke=Math.max(2,d.pke*.75);else d.pke=Math.min(100,Math.max(5,d.pke+(Math.random()-.45)*9));
  d.stats.peak=Math.max(d.stats.peak,Math.round(d.pke));refreshOnsite();
 },600);
}
function refreshOnsite(){
 const d=deployment;if(!d||d.phase!=="ONSITE"||!document.getElementById("pkeCells"))return;
 const v=Math.round(d.pke),on=Math.round(v/5);
 document.querySelectorAll("#pkeCells i").forEach((c,i)=>{c.className=i<on?(i>=14?"on crit":i>=9?"on hi":"on"):""});
 document.getElementById("pkeVal").textContent="PKE // "+v+" // "+pkeLevel(v);
 document.getElementById("pkeLvl").textContent=pkeLevel(v);
 const left=4-d.stats.traps,tb=document.getElementById("trapBtn");
 tb.textContent="DEPLOY TRAP ("+left+" LEFT)";tb.disabled=left<=0;
 document.getElementById("bkBtn").disabled=d.stats.backup;
 document.getElementById("osEnt").textContent=d.stats.contained?"CONTAINED":"ACTIVE";
 document.getElementById("osScans").textContent=d.stats.scans;
 document.getElementById("osState").textContent=d.stats.contained?"ENTITY CONTAINED":"INVESTIGATING";
 document.getElementById("osLamp").className="lamp"+(d.stats.contained?"":" warn");
 document.getElementById("osLog").innerHTML=d.log.slice(-8).reverse().map(l=>`<div>${fmt(l.t)} // ${esc(l.msg)}</div>`).join("");
}
function scanArea(){const d=deployment;d.stats.scans++;addLog("SCAN COMPLETE // PKE "+Math.round(d.pke)+" // "+pkeLevel(d.pke));sfx.tick();refreshOnsite()}
function deployTrap(){
 const d=deployment,st=d.stats;if(st.traps>=4){sfx.deny();return}
 st.traps++;
 if(st.contained){addLog("TRAP DEPLOYED // NO ACTIVE ENTITY");sfx.tick()}
 else if(d.pke<35){addLog("TRAP DEPLOYED // READING TOO LOW TO CAPTURE");sfx.deny()}
 else if(Math.random()<(st.backup?.9:.75)){st.contained=true;addLog("ENTITY CAPTURED // TRAP CLOSED");sfx.chirp()}
 else{d.pke=Math.min(100,d.pke+10);addLog("TRAP MISSED // ENTITY EVASIVE");sfx.deny()}
 refreshOnsite();
}
function requestBackup(){const d=deployment;if(d.stats.backup)return;d.stats.backup=true;addLog("BACKUP REQUESTED // IMPROVES CAPTURE ODDS");sfx.confirm();refreshOnsite()}
function concludeInvestigation(){
 if(deployment.stats.contained)return confirmConclude();
 openDialog(`<h2>CONCLUDE INVESTIGATION</h2><div class="msg">THE ENTITY IS NOT CONTAINED.<br>THE CASE WILL BE RECORDED AS UNRESOLVED.</div><div class="btn-row"><button class="action" onclick="closeDialog()">KEEP WORKING</button><button class="action btn-primary" onclick="confirmConclude()">CONCLUDE</button></div>`);
}
function confirmConclude(){
 const d=deployment;if(!d||d.phase!=="ONSITE")return;
 closeDialog();d.onsiteMs=Date.now()-d.onsiteStart;d.phase="REPORT";d.reportStart=Date.now();
 setTeamStatus("RETURNING");sfx.confirm();setRoute("report");
}

/* 06 REPORT */
function renderReport(){
 const d=deployment,screen=document.getElementById("screen");
 if(!d||d.phase!=="REPORT"){
  const log=caseLog();
  screen.innerHTML=hdr("06","CASE REPORT",d?"MISSION STILL IN PROGRESS":"CASE HISTORY")+(d?`<div class="notice">The active mission is at ${phaseLabel[d.phase]}.</div><button class="action btn-primary" onclick="setRoute('${phaseRoute[d.phase]}')">GO TO ${phaseLabel[d.phase]}</button>`:
   `<section class="card"><h2>CLOSED CASES <span class="panel-code">LAST ${log.length}</span></h2>${log.length?`<table class="team-table"><thead><tr><th>CASE</th><th>DATE</th><th>SITE</th><th>TEAM</th><th>OUTCOME</th></tr></thead><tbody>${log.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.date)}</td><td>${esc(r.site)}</td><td>${esc(r.team)}</td><td>${esc(r.outcome)}</td></tr>`).join("")}</tbody></table>`:'<div class="readout">NO CASES CLOSED YET. FINISH A MISSION TO SEE IT HERE.</div>'}</section>`);
  return;
 }
 const s=d.stats;
 screen.innerHTML=hdr("06","CASE REPORT","RETURN TO BASE → CLOSE CASE",'<div class="status"><i class="lamp warn" id="rtLamp"></i><span id="rtState">RETURNING</span></div>')+`
 <div class="grid"><section class="card"><h2>${esc(d.caseId)} // SUMMARY</h2><div class="readout">${missionKV(d)}
  <div class="kv"><span class="k">OUTCOME</span><span class="v">${s.contained?"ENTITY CONTAINED":"UNRESOLVED"}</span></div>
  <div class="kv"><span class="k">TRAPS USED</span><span class="v">${s.traps} OF 4</span></div>
  <div class="kv"><span class="k">SCANS</span><span class="v">${s.scans}</span></div>
  <div class="kv"><span class="k">PEAK PKE</span><span class="v">${s.peak} // ${pkeLevel(s.peak)}</span></div>
  <div class="kv"><span class="k">BACKUP</span><span class="v">${s.backup?"REQUESTED":"NOT REQUESTED"}</span></div>
  <div class="kv"><span class="k">TRAVEL TIME</span><span class="v">${fmt(d.travelMs)}</span></div>
  <div class="kv"><span class="k">ON-SITE TIME</span><span class="v">${fmt(d.onsiteMs)}</span></div></div></section>
 <aside><section class="card"><h2>RETURN TO BASE</h2><div class="bar"><i id="rtBar"></i></div><div class="readout" id="rtPct">0%</div>
  <button class="action btn-primary" id="closeBtn" style="width:100%;margin-top:10px" disabled onclick="closeCase()">CLOSE CASE</button></section></aside></div>`;
 const tick=()=>{
  const p=Math.min(1,(Date.now()-d.reportStart)/RETURN_MS);
  document.getElementById("rtBar").style.width=(p*100)+"%";document.getElementById("rtPct").textContent=Math.round(p*100)+"%";
  if(p>=1){clearInterval(mTimer);document.getElementById("rtLamp").className="lamp";document.getElementById("rtState").textContent="AT BASE";document.getElementById("closeBtn").disabled=false}
 };
 tick();mTimer=setInterval(tick,250);
}
function closeCase(){
 const d=deployment;if(!d||d.phase!=="REPORT")return;
 const rec={id:d.caseId,date:new Date().toLocaleDateString("en-GB"),site:d.location.site,team:d.team.id,outcome:d.stats.contained?"CONTAINED":"UNRESOLVED"};
 try{localStorage.setItem("ectoCaseLog",JSON.stringify([rec,...caseLog()].slice(0,20)));localStorage.setItem("ectoCaseNo",String(caseNo()+1))}catch(e){}
 setTeamStatus("AVAILABLE");deployment=null;sfx.chirp();setRoute("report");
}

function renderConfig(){
 const p=profile;
 document.getElementById("screen").innerHTML=`
 <div class="screen-head"><div><div class="eyebrow">07 // SYSTEM CONTROL</div><h1>CONFIGURATION</h1><div class="sub">DISPLAY PROFILE // OPERATIONAL RESOURCES // LOCAL SETTINGS</div></div></div>
 <section class="card">
  <h2>DISPLAY PROFILE <span class="panel-code">PRIMARY INTERFACE LANGUAGE</span></h2>
  <div class="notice"><b>CASSETTE FUTURISM</b> is the ECTO OS primary visual identity. Alternate profiles change presentation only; they do not replace the core ECTO interface language.</div>
  <div class="profile-grid">
   ${Object.entries(profiles).map(([id,x])=>`<button class="profile ${id} ${p===id?'selected':''}" onclick="applyProfile('${id}')"><i class="sample"></i><strong>${x.label}</strong><span>${id==="cassette"?"PRIMARY // RETROACTIVE MODERNISM":id==="phosphor"?"GREEN CRT // OPTIONAL":"OPTIONAL DISPLAY PROFILE"}</span></button>`).join("")}
  </div>
 </section>
 <div class="grid" style="margin-top:12px">
  <section class="card"><h2>RESPONSE TEAM MANAGEMENT <span class="panel-code">LOCAL REGISTER</span></h2>
   <table class="team-table"><thead><tr><th>ID</th><th>NAME</th><th>CREW</th><th>STATUS</th><th></th></tr></thead><tbody>
   ${teams.map((t,i)=>`<tr><td>${t.id}</td><td>${t.name}</td><td>${t.crew}</td><td>${t.status}</td><td><div class="team-actions"><button class="mini" onclick="editTeam(${i})">EDIT</button><button class="mini" onclick="deleteTeam(${i})">DELETE</button></div></td></tr>`).join("")}
   </tbody></table>
   <hr><button class="action btn-primary" onclick="newTeam()">+ NEW TEAM</button>
  </section>
  <aside class="card"><h2>DISPLAY STATE</h2><div class="readout">
   ACTIVE PROFILE // ${profiles[p].label}<br>
   STORAGE // LOCAL<br>
   UI LANGUAGE // EUROSTILE<br>
   DATA / TELEMETRY // COURIER<br>
   CRT EFFECT // RESTRAINED<br>
   VISUAL NOISE // LOW
  </div></aside>
 </div>`;
}
const statuses=["AVAILABLE","STANDBY","DEPLOYED","EN ROUTE","INVESTIGATING","RETURNING","OFFLINE"];
let lastFocus=null;
function closeDialog(){
 const m=document.getElementById("modal");if(m)m.remove();
 document.removeEventListener("keydown",dialogKeys);
 if(lastFocus&&document.contains(lastFocus))lastFocus.focus();
}
function dialogKeys(e){
 if(e.key==="Escape"){closeDialog();return}
 if(e.key!=="Tab")return;
 const f=[...document.querySelectorAll("#modal input,#modal select,#modal textarea,#modal button")].filter(x=>!x.disabled);
 if(!f.length)return;
 const first=f[0],last=f[f.length-1];
 if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
 else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
}
function openDialog(html){
 closeDialog();
 lastFocus=document.activeElement;
 const m=document.createElement("div");
 m.className="modal";m.id="modal";
 m.innerHTML='<div class="dialog" role="dialog" aria-modal="true">'+html+'</div>';
 m.addEventListener("mousedown",e=>{if(e.target===m)closeDialog()});
 document.body.appendChild(m);
 document.addEventListener("keydown",dialogKeys);
 const first=m.querySelector("input,select,textarea,button");if(first)first.focus();
}
function newTeam(){editTeam(-1)}
function editTeam(i){
 const t=i<0?{id:"",name:"",crew:6,status:"AVAILABLE"}:teams[i];
 openDialog(`
  <h2>${i<0?"NEW RESPONSE TEAM":"EDIT TEAM // "+t.id}</h2>
  <div class="err" id="teamErr" role="alert" hidden></div>
  <div class="field"><label for="tId">TEAM ID / CALLSIGN</label><input id="tId" maxlength="16" autocomplete="off" value="${t.id}"></div>
  <div class="field"><label for="tName">TEAM NAME</label><input id="tName" maxlength="32" autocomplete="off" value="${t.name}"></div>
  <div class="form-grid">
   <div class="field"><label for="tCrew">CREW SIZE</label><input id="tCrew" type="number" min="1" max="99" value="${t.crew}"></div>
   <div class="field"><label for="tStatus">STATUS</label><select id="tStatus">${statuses.map(x=>`<option ${x===t.status?"selected":""}>${x}</option>`).join("")}</select></div>
  </div>
  <div class="btn-row"><button class="action" onclick="closeDialog()">CANCEL</button><button class="action btn-primary" onclick="saveTeam(${i})">SAVE TEAM</button></div>`);
}
function saveTeam(i){
 const id=document.getElementById("tId").value.trim().toUpperCase();
 const name=document.getElementById("tName").value.trim().toUpperCase();
 const crew=parseInt(document.getElementById("tCrew").value);
 const status=document.getElementById("tStatus").value;
 const err=document.getElementById("teamErr");
 const fail=m=>{sfx.deny();err.textContent=m;err.hidden=false};
 if(!id)return fail("TEAM ID IS REQUIRED.");
 if(!name)return fail("TEAM NAME IS REQUIRED.");
 if(!(crew>=1))return fail("CREW SIZE MUST BE AT LEAST 1.");
 if(teams.some((x,n)=>n!==i&&x.id.toUpperCase()===id))return fail("TEAM ID "+id+" IS ALREADY IN USE.");
 const rec={id,name,crew,status};
 if(i<0)teams.push(rec);else teams[i]=rec;
 sfx.confirm();saveTeams();closeDialog();renderConfig();
}
function deleteTeam(i){
 const t=teams[i];
 if(!["AVAILABLE","STANDBY","OFFLINE"].includes(t.status)){
  sfx.deny();openDialog(`<h2>CANNOT DELETE // ${t.id}</h2><div class="msg">${t.id} IS ${t.status}.<br>ACTIVE DEPLOYMENTS CANNOT BE DELETED.</div><div class="btn-row"><button class="action btn-primary" onclick="closeDialog()">OK</button></div>`);
  return;
 }
 openDialog(`<h2>DELETE TEAM // ${t.id}</h2><div class="msg">${t.id} // ${t.name}<br>THIS REMOVES THE TEAM FROM THE LOCAL REGISTER.</div><div class="btn-row"><button class="action" onclick="closeDialog()">CANCEL</button><button class="action btn-danger" onclick="confirmDelete(${i})">DELETE TEAM</button></div>`);
}
function confirmDelete(i){
 sfx.confirm();teams.splice(i,1);saveTeams();closeDialog();renderConfig();
}
function render(){document.getElementById("profileStatus").textContent=profiles[profile].label;document.getElementById("footerState").textContent="LOCAL DISPLAY PROFILE // "+profiles[profile].label;renderConfig()}
function bootSequence(){
 const boot=document.getElementById("boot"),txt=document.getElementById("bootText"),prompt=document.getElementById("bootPrompt");
 const lines=["ECTO OS // FIELD OPERATIONS SYSTEM","MEMORY CHECK ............ OK","DISPLAY PROFILE ......... "+profiles[profile].label,"RESPONSE GRID ........... LOADED","TEAM REGISTER ........... "+teams.length+" TEAMS","LOCAL STORAGE ........... OK","","SYSTEM OPERATIONAL"];
 const slow=!matchMedia("(prefers-reduced-motion:reduce)").matches;
 let started=false,skip=false,done=false;
 function finish(){if(done)return;done=true;document.removeEventListener("keydown",go);boot.removeEventListener("pointerdown",go);sfx.chirp();boot.classList.add("out");setTimeout(()=>boot.remove(),slow?450:0)}
 function go(e){
  if(started){skip=true;return}
  started=true;ac();prompt.remove();
  let n=0;
  (function next(){
   if(skip||n>=lines.length){txt.textContent=lines.join("\n");setTimeout(finish,skip?0:350);return}
   txt.textContent=lines.slice(0,++n).join("\n");
   if(lines[n-1])sfx.tick();
   setTimeout(next,slow?230:30);
  })();
 }
 document.addEventListener("keydown",go);boot.addEventListener("pointerdown",go);
}
bootSequence();

/* PWA: install button + update prompt */
let installEv=null;
const instBtn=document.getElementById("installBtn");
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEv=e;instBtn.hidden=false});
window.addEventListener("appinstalled",()=>{instBtn.hidden=true});
instBtn.addEventListener("click",()=>{if(!installEv)return;installEv.prompt();installEv.userChoice.finally(()=>{installEv=null;instBtn.hidden=true})});
function showUpdate(w){
 if(document.getElementById("updBar"))return;
 const bar=document.createElement("div");bar.className="update";bar.id="updBar";bar.setAttribute("role","status");
 bar.innerHTML="<span>UPDATE READY"+(deployment?" // MISSION IN PROGRESS, RELOADING ENDS IT":"")+"</span><button class=\"mini\" id=\"updBtn\">RELOAD</button>";
 document.body.appendChild(bar);sfx.confirm();
 document.getElementById("updBtn").onclick=()=>w.postMessage("SKIP_WAITING");
}
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){
 const hadController=!!navigator.serviceWorker.controller;
 let reloading=false;
 navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!hadController||reloading)return;reloading=true;location.reload()});
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
   if(reg.waiting&&navigator.serviceWorker.controller)showUpdate(reg.waiting);
   reg.addEventListener("updatefound",()=>{const w=reg.installing;if(w)w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)showUpdate(w)})});
   document.addEventListener("visibilitychange",()=>{if(!document.hidden)reg.update()});
  }).catch(()=>{});
 });
}
Object.assign(window,{skipTravel,abortMission,confirmAbort,beginInvestigation,scanArea,deployTrap,requestBackup,concludeInvestigation,confirmConclude,closeCase,newFranchise,addFranchiseHere,editFranchise,deleteFranchise,confirmDeleteFr,saveFranchise,fillPlace,pickFranchise,frNav,setRoute,renderMap,applyProfile,newTeam,editTeam,deleteTeam,saveTeam,confirmDelete,closeDialog,proceedPreflight,launch});
setRoute("map");
})();
