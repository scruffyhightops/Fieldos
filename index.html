<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ECTO OS // Visual Demo 002</title>
<style>
:root{--bg:#070a08;--panel:#0c120e;--panel2:#101a13;--line:#315b3a;--fg:#c7ffd0;--dim:#78a882;--amber:#e7b34c;--cyan:#69dbe0;--danger:#ef6254;--ok:#6cdb78}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:14px "Courier New",monospace;min-height:100%}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 4px);opacity:.35}
button,select{font:inherit;color:var(--fg);background:#0a110c;border:1px solid var(--line);padding:9px 11px;border-radius:2px}button{cursor:pointer}button:hover{border-color:var(--amber);color:#fff}select{width:100%}
.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#090e0b}
.brand{font-size:18px;letter-spacing:2px}.status{font-size:12px;color:var(--dim)}.lamp{display:inline-block;width:7px;height:7px;background:var(--ok);margin-right:7px}
.layout{display:grid;grid-template-columns:190px 1fr;min-height:calc(100vh - 58px)}nav{border-right:1px solid var(--line);padding:12px;background:#080d0a}
.navbtn{display:block;width:100%;text-align:left;margin-bottom:6px;font-size:12px}.navbtn.active{border-color:var(--amber);color:var(--amber);background:#14120b}
main{padding:18px;max-width:1400px;width:100%;margin:auto}h1{font-size:17px;letter-spacing:2px;font-weight:normal;margin:0 0 5px}h2{font-size:12px;color:var(--dim);font-weight:normal;margin:0 0 16px}
.grid{display:grid;gap:12px}.two{grid-template-columns:1.4fr 1fr}.three{grid-template-columns:repeat(3,1fr)}
.panel{border:1px solid var(--line);background:linear-gradient(145deg,var(--panel),var(--panel2));padding:14px;min-width:0}.paneltitle{font-size:11px;color:var(--amber);letter-spacing:1px;border-bottom:1px solid #24472d;padding-bottom:8px;margin-bottom:12px}
.readout{font-size:22px;margin:5px 0 12px}.small{font-size:11px;color:var(--dim)}.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #1c3824}.row:last-child{border-bottom:0}
.ok{color:var(--ok)}.warn{color:var(--amber)}.danger{color:var(--danger)}.cyan{color:var(--cyan)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.map{height:350px;position:relative;overflow:hidden;background:linear-gradient(rgba(62,130,76,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(62,130,76,.16) 1px,transparent 1px),#08110b;background-size:32px 32px}
.map:after{content:"UK REGIONAL GRID // DEMO";position:absolute;right:12px;top:10px;color:#456d4d;font-size:10px}
.ukshape{position:absolute;left:23%;top:12%;width:48%;height:74%;border:1px solid #487b50;clip-path:polygon(46% 0,59% 7%,65% 17%,61% 27%,75% 34%,70% 45%,80% 55%,68% 64%,72% 75%,59% 85%,48% 100%,38% 91%,31% 78%,20% 71%,26% 57%,14% 47%,25% 36%,20% 25%,31% 18%,34% 7%);opacity:.65}
.marker{position:absolute;width:10px;height:10px;border:1px solid var(--amber);transform:rotate(45deg);background:#0c160e}.marker span{position:absolute;transform:rotate(-45deg);left:12px;top:-9px;white-space:nowrap;font-size:10px}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.step{border:1px solid var(--line);padding:9px 10px;font-size:11px}.arrow{color:var(--amber)}
.bar{height:9px;border:1px solid var(--line);margin:5px 0 12px}.bar i{display:block;height:100%;background:var(--ok)}.bar.warn i{background:var(--amber)}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}.tab{padding:7px 9px}.tab.active{border-color:var(--cyan);color:var(--cyan)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.show{display:flex}.modalbox{max-width:600px;width:100%;border:1px solid var(--amber);background:#09100b;padding:18px}
@media(max-width:800px){.layout{grid-template-columns:1fr}nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);gap:6px}.navbtn{min-width:145px;margin:0}.two,.three{grid-template-columns:1fr}.map{height:280px}main{padding:12px}}
</style>
</head>
<body>
<header class="top"><div class="brand">ECTO OS</div><div class="status"><span class="lamp"></span>SYSTEM OPERATIONAL // LOCAL DATABASE // DEMO 002</div></header>
<div class="layout"><nav id="nav"></nav><main id="app"></main></div>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<script>
const navItems=["RESPONSE MAP","ECTO DISPATCH","SPECTRE DATABASE","INCIDENT LOG","CONTAINMENT GRID","DIAGNOSTICS","CONFIGURATION"];
let page="RESPONSE MAP",state={case:"SE-0261",location:"Portsmouth, Hampshire",site:"Portsmouth Harbour Sector",team:"ECHO-2",vehicle:"ECTO-04",deployed:false};
const app=document.getElementById("app"),nav=document.getElementById("nav");
function navRender(){nav.innerHTML=navItems.map(x=>`<button class="navbtn ${page===x?"active":""}" onclick="go('${x}')">${x}</button>`).join("")}
function go(x){page=x;navRender();render()}
function header(a,b){return `<h1>${a}</h1><h2>${b}</h2>`}
function info(t){document.getElementById("modalbox").innerHTML=`<div class="paneltitle">ECTO OS // DEMO MESSAGE</div><p>${t}</p><div class="actions"><button onclick="closeModal()">CLOSE</button></div>`;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function preflight(){document.getElementById("modalbox").innerHTML=`<div class="paneltitle">ECTO PRE-FLIGHT // ${state.team}</div>${[["PROTON PACK","CONNECTED"],["PKE METER","READY"],["ECTO-GOGGLES","READY"],["GHOST TRAP","READY"]].map(x=>`<div class="row"><span>${x[0]}</span><span class="ok">${x[1]}</span></div>`).join("")}<div class="row"><span>VEHICLE</span><span>${state.vehicle}</span></div><div class="actions"><button onclick="state.deployed=true;closeModal();go('ECTO DISPATCH')">CONFIRM DEPLOYMENT</button><button onclick="closeModal()">CANCEL</button></div>`;document.getElementById("modal").classList.add("show")}
function map(){return header("RESPONSE MAP","REGIONAL OPERATIONS // LOCATION SELECTION")+`<div class="grid two"><div class="panel"><div class="map"><div class="ukshape"></div><div class="marker" style="left:58%;top:58%"><span>PORTSMOUTH</span></div><div class="marker" style="left:55%;top:47%"><span>LONDON</span></div><div class="marker" style="left:47%;top:39%"><span>BIRMINGHAM</span></div><div class="marker" style="left:33%;top:22%"><span>EDINBURGH</span></div></div></div><div class="panel"><div class="paneltitle">SELECTED LOCATION</div><div class="readout">PORTSMOUTH</div><div class="row"><span>REGION</span><span>HAMPSHIRE</span></div><div class="row"><span>GRID</span><span class="cyan">C3 / B2</span></div><div class="row"><span>CASE</span><span>${state.case}</span></div><div class="row"><span>STATUS</span><span class="warn">ACTIVE</span></div><div class="row"><span>SITE</span><span>HARBOUR SECTOR</span></div><div class="actions"><button onclick="go('ECTO DISPATCH')">OPEN DISPATCH</button><button onclick="info('Location editing is restricted to Configuration / Location Management.')">LOCATION INFO</button></div></div></div>`}
function dispatch(){return header("ECTO DISPATCH","CASE → TEAM → VEHICLE → PRE-FLIGHT → DEPLOY")+`<div class="panel"><div class="paneltitle">DEPLOYMENT WORKFLOW</div><div class="flow">${[["CASE",state.case],["LOCATION","PORTSMOUTH"],["SITE","HARBOUR"],["TEAM",state.team],["VEHICLE",state.vehicle]].map((x,i)=>`<div class="step">${x[0]}<br><b>${x[1]}</b></div>${i<4?'<span class="arrow">›</span>':''}`).join("")}</div></div><div class="grid two" style="margin-top:12px"><div class="panel"><div class="paneltitle">DEPLOYMENT RECORD</div><div class="row"><span>CASE ID</span><span>${state.case}</span></div><div class="row"><span>LOCATION</span><span>${state.location}</span></div><div class="row"><span>INVESTIGATION SITE</span><span>${state.site}</span></div><label class="small">RESPONSE TEAM<select onchange="state.team=this.value;render()"><option>ECHO-2</option><option>DELTA-1</option><option>ALPHA-3</option></select></label><label class="small" style="display:block;margin-top:10px">VEHICLE<select onchange="state.vehicle=this.value;render()"><option>ECTO-04</option><option>ECTO-02</option><option>ECTO-06</option></select></label><div class="actions"><button onclick="go('DIAGNOSTICS')">SYSTEM CHECK</button><button onclick="preflight()">OPEN PRE-FLIGHT</button></div></div><div class="panel"><div class="paneltitle">OPERATIONAL STATUS</div><div class="row"><span>TEAM</span><span class="ok">READY</span></div><div class="row"><span>VEHICLE</span><span class="ok">AVAILABLE</span></div><div class="row"><span>CASE DATA</span><span class="ok">RECEIVED</span></div><div class="row"><span>DEPLOYMENT</span><span class="${state.deployed?"ok":"warn"}">${state.deployed?"DEPLOYED":"STANDBY"}</span></div><div class="actions"><button onclick="state.deployed=true;render();info('Demo deployment command accepted. Field status would begin here in the full build.')">DEPLOY TEAM</button></div></div></div>`}
function spectre(){return header("SPECTRE DATABASE","CLASSIFICATION // PKE RESPONSE // TECHNICAL RECORD")+`<div class="tabs">${["I","II","III","IV","V","VI","VII"].map(x=>`<button class="tab ${x==="III"?"active":""}" onclick="info('Class ${x} selected.')">CLASS ${x}</button>`).join("")}</div><div class="grid two"><div class="panel"><div class="paneltitle">SPECTRE RECORD</div><div class="readout">CLASS III</div><div class="row"><span>DESIGNATION</span><span>UNSTABLE APPARITION</span></div><div class="row"><span>PKE RESPONSE</span><span class="cyan">ELEVATED</span></div><div class="row"><span>CONTAINMENT</span><span class="warn">RECOMMENDED</span></div><div class="actions"><button onclick="info('Thermal-printer report queued in demo.')">PRINT RECORD</button></div></div><div class="panel"><div class="paneltitle">PKE RESPONSE TRACE</div><svg viewBox="0 0 500 180" style="width:100%;height:180px;background:#08100b"><polyline points="0,140 35,138 55,120 75,145 100,65 120,132 145,118 165,40 190,125 215,110 245,150 275,72 300,128 330,55 360,130 390,98 420,145 455,85 500,118" fill="none" stroke="currentColor" stroke-width="2"/></svg></div></div>`}
function incident(){return header("INCIDENT LOG","FIELD RECORD // CASE "+state.case)+`<div class="grid two"><div class="panel"><div class="paneltitle">CASE RECORD</div><div class="row"><span>CASE</span><span>${state.case}</span></div><div class="row"><span>LOCATION</span><span>Portsmouth, Hampshire</span></div><div class="row"><span>SITE</span><span>Portsmouth Harbour Sector</span></div><div class="row"><span>STATUS</span><span class="warn">${state.deployed?"FIELD DEPLOYMENT":"ACTIVE INVESTIGATION"}</span></div></div><div class="panel"><div class="paneltitle">DATA OWNERSHIP</div><p class="small">Research case information is treated as SER-owned reference data. ECTO operational records are added by the field system.</p><div class="row"><span>SER REFERENCE</span><span class="ok">READ ONLY</span></div><div class="row"><span>ECTO OPERATIONS</span><span class="cyan">LOCAL</span></div></div></div>`}
function containment(){return header("CONTAINMENT GRID","FIELD CONTROL // SIMULATION")+`<div class="grid three"><div class="panel"><div class="paneltitle">GRID STABILITY</div><div class="readout">${state.deployed?"87":"94"}%</div><div class="bar"><i style="width:${state.deployed?87:94}%"></i></div><span class="ok">STABLE</span></div><div class="panel"><div class="paneltitle">EMF FIELD</div><div class="readout">${state.deployed?"64":"42"}</div><div class="bar warn"><i style="width:${state.deployed?64:42}%"></i></div><span class="warn">ELEVATED</span></div><div class="panel"><div class="paneltitle">FIELD STATE</div><div class="readout">ACTIVE</div><span class="cyan">WAVEFORM NOMINAL</span></div></div><div class="panel" style="margin-top:12px"><div class="paneltitle">FIELD WAVEFORM</div><svg viewBox="0 0 900 180" style="width:100%;height:180px;background:#08100b"><polyline points="0,120 90,120 110,45 160,45 180,135 270,135 290,60 340,60 360,125 450,125 470,35 520,35 540,145 630,145 650,70 700,70 720,120 810,120 830,50 900,50" fill="none" stroke="currentColor" stroke-width="3"/></svg><div class="actions"><button onclick="info('Containment simulation reset.')">RESET FIELD</button></div></div>`}
function diagnostics(){return header("DIAGNOSTICS","EQUIPMENT HEALTH // SYSTEM READINESS")+`<div class="grid three">${[["PROTON PACK","CONNECTED"],["PKE METER","READY"],["GHOST TRAP","READY"]].map(x=>`<div class="panel"><div class="paneltitle">${x[0]}</div><div class="readout ok">${x[1]}</div><div class="row"><span>POWER</span><span>100%</span></div><div class="row"><span>LINK</span><span class="ok">STABLE</span></div><div class="actions"><button onclick="info('${x[0]} diagnostic routine complete.')">RUN CHECK</button></div></div>`).join("")}</div>`}
function config(){return header("CONFIGURATION","SYSTEM CONTROL // PROTECTED SETTINGS")+`<div class="grid two"><div class="panel"><div class="paneltitle">DISPLAY PROFILE</div><div class="row"><span>PROFILE</span><span>GREEN CRT</span></div><div class="row"><span>INTERFACE</span><span>RETRO-TECHNICAL</span></div><div class="row"><span>MAP EDITING</span><span class="warn">PROTECTED</span></div><div class="actions"><button onclick="info('Theme controls will be connected in the production build.')">DISPLAY SETTINGS</button><button onclick="info('Location Management is protected by its separate administrator control.')">LOCATION MANAGEMENT</button></div></div><div class="panel"><div class="paneltitle">SYSTEM HISTORY</div><div class="row"><span>BUILD</span><span>VISUAL DEMO 002</span></div><div class="row"><span>DATABASE</span><span>LOCAL / DEMO</span></div><div class="row"><span>DATA LINK</span><span class="cyan">SER → ECTO CONCEPT</span></div></div></div>`}
function render(){const f={"RESPONSE MAP":map,"ECTO DISPATCH":dispatch,"SPECTRE DATABASE":spectre,"INCIDENT LOG":incident,"CONTAINMENT GRID":containment,"DIAGNOSTICS":diagnostics,"CONFIGURATION":config}[page];app.innerHTML=f()}
navRender();render();
</script>
</body>
</html>
