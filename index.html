<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ECTO OS // Cassette Futurism 002</title>
<style>
:root{--bg:#070907;--bg2:#0a0d0a;--panel:#101410;--panel2:#151a15;--line:#394039;--line2:#596059;--fg:#c4c9c0;--fg2:#9fa79e;--dim:#697069;--green:#72ff7a;--green2:#4fc95b;--yellow:#d8c84f;--cyan:#69c8c8;--red:#df5c52;--accent:var(--green);--accent2:var(--green2);--font-ui:Eurostile,'Arial Narrow',Arial,sans-serif;--font-data:'Courier New',Courier,monospace}
[data-theme="phosphor"]{--fg:#b8cdb8;--fg2:#8fa58f;--accent:#72ff7a;--accent2:#45d957;--yellow:#c9d85a}
[data-theme="amber"]{--accent:#e4b85c;--accent2:#b98336;--yellow:#e8c86b;--cyan:#b8a16b}
[data-theme="cyan"]{--accent:#69d4d0;--accent2:#3ba9a5;--yellow:#b7d7c8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:var(--font-ui)}body{background-image:linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.01) 1px,transparent 1px);background-size:24px 24px}button,input,select{font:inherit}button{color:var(--fg);background:#0c100c;border:1px solid var(--line);border-radius:0;cursor:pointer}button:hover{border-color:var(--line2);background:#111711}button.active,.btn-primary{border-color:var(--accent);color:var(--accent);background:#101810}input,select{width:100%;min-height:40px;background:#090c09;color:var(--fg);border:1px solid var(--line);border-radius:0;padding:8px 10px}.app{min-height:100vh;display:flex;flex-direction:column}.topbar{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#090c09}.brand{font-size:22px;letter-spacing:.08em}.brand small{display:block;font-size:9px;color:var(--dim);letter-spacing:.14em;margin-top:3px}.topstatus{font:10px/1.5 var(--font-data);text-align:right;color:var(--fg2)}.layout{display:grid;grid-template-columns:190px 1fr;min-height:calc(100vh - 96px);flex:1}.nav{border-right:1px solid var(--line);padding:12px;background:#090c09}.nav-title,.eyebrow,.label,.panel-code{font-size:9px;letter-spacing:.14em;color:var(--dim)}.nav-title{padding:4px 6px 10px}.nav button{display:block;width:100%;text-align:left;padding:11px 8px;margin:3px 0;font-size:10px;letter-spacing:.08em}.content{padding:18px;overflow:auto}.screen-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:14px}h1{font-size:22px;font-weight:500;letter-spacing:.08em;margin:3px 0 4px}.sub{font-size:10px;color:var(--fg2);letter-spacing:.05em}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.8fr);gap:12px}.card{border:1px solid var(--line);background:linear-gradient(135deg,var(--panel),var(--panel2));padding:12px}.card h2{font-size:11px;font-weight:500;letter-spacing:.1em;margin:0 0 10px;color:var(--fg2)}.readout{font:11px/1.65 var(--font-data)}.kv{display:grid;grid-template-columns:145px 1fr;gap:5px;border-top:1px solid #252b25;padding:7px 0}.kv:first-child{border-top:0}.k{color:var(--dim);font-size:9px;letter-spacing:.08em}.v{color:var(--fg2);font:10px var(--font-data)}.status{display:inline-flex;align-items:center;gap:7px;font:10px var(--font-data)}.lamp{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 5px var(--accent)}.lamp.warn{background:var(--yellow)}.lamp.red{background:var(--red)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.action{padding:10px;font-size:9px;letter-spacing:.08em}.notice{border-left:2px solid var(--accent);background:#0d120d;padding:9px 10px;color:var(--fg2);font-size:10px;line-height:1.5;margin-bottom:12px}.map{height:470px;border:1px solid var(--line);position:relative;overflow:hidden;background:#0b0f0b}.map:before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(114,255,122,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(114,255,122,.03) 1px,transparent 1px);background-size:52px 52px}.map:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.32) 100%)}.mapline{position:absolute;border-top:1px solid #303930;transform-origin:left center;opacity:.7}.marker{position:absolute;z-index:2;background:transparent;border:0;width:90px;height:46px;transform:translate(-50%,-50%);padding:0}.marker .dot{width:10px;height:10px;border:1px solid currentColor;margin:auto;background:#0b0f0b}.marker .ring{position:absolute;left:50%;top:15px;width:26px;height:26px;border:1px solid currentColor;transform:translate(-50%,-50%);opacity:.35}.marker span{display:block;margin-top:3px;font:9px var(--font-ui);letter-spacing:.06em;white-space:nowrap}.marker.alert{color:var(--red);animation:flash 1.2s steps(2,end) infinite}.marker.monitor{color:var(--yellow)}.marker.active{color:var(--accent)}@keyframes flash{50%{opacity:.38}}.crumbs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}.crumb{padding:6px 8px;font:9px var(--font-data);color:var(--fg2)}.crumb.current{border-color:var(--accent);color:var(--accent)}.drill-list{display:grid;gap:5px}.drill-item{display:grid;grid-template-columns:1fr auto;gap:10px;text-align:left;padding:9px}.drill-item strong{display:block;font-size:10px;letter-spacing:.06em}.drill-item span{display:block;color:var(--dim);font:9px var(--font-data);margin-top:3px}.badge{font:8px var(--font-data);color:var(--accent);align-self:center}.profile-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.profile{min-height:88px;text-align:left;padding:10px;position:relative}.profile strong{display:block;font-size:10px;letter-spacing:.08em;margin-bottom:5px}.profile span{display:block;color:var(--dim);font-size:9px;line-height:1.4}.profile.selected{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.profile .sample{position:absolute;right:9px;top:10px;width:7px;height:7px;background:var(--sample)}.cassette{--sample:#72ff7a}.phosphor{--sample:#72ff7a}.amber{--sample:#e4b85c}.cyan{--sample:#69d4d0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:var(--dim);font-size:9px;letter-spacing:.1em;margin-bottom:5px}.team-table{width:100%;border-collapse:collapse;font-size:10px}.team-table th,.team-table td{border-bottom:1px solid #252b25;padding:9px 6px;text-align:left}.team-table th{color:var(--dim);font-size:8px;letter-spacing:.1em;font-weight:400}.team-actions{display:flex;gap:5px}.mini{padding:6px 8px;font-size:8px}.footer{height:32px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 12px;font:9px var(--font-data);color:var(--dim)}hr{border:0;border-top:1px solid var(--line);margin:13px 0}.back{margin-bottom:10px;padding:7px 9px;font-size:9px}.small-note{font:9px/1.5 var(--font-data);color:var(--dim)}@media(max-width:800px){.layout{grid-template-columns:1fr}.nav{border-right:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.nav-title{grid-column:1/-1}.content{padding:10px}.grid{grid-template-columns:1fr}.map{height:390px}.profile-grid{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.topbar{padding:0 10px}}@media(prefers-reduced-motion:reduce){.marker.alert{animation:none}}
</style>
</head>
<body data-theme="cassette">
<div class="app">
<header class="topbar"><div class="brand">ECTO OS<small>FIELD OPERATIONS SYSTEM // CASSETTE FUTURISM</small></div><div class="topstatus">SYSTEM // <b style="color:var(--accent)">OPERATIONAL</b><br>PROFILE // <span id="profileStatus">CASSETTE FUTURISM</span></div></header>
<div class="layout"><nav class="nav" id="nav"><div class="nav-title">ECTO FIELD TERMINAL</div><button data-route="map">01 RESPONSE MAP</button><button data-route="dispatch">02 ECTO DISPATCH</button><button data-route="config">07 CONFIGURATION</button></nav><main class="content"><div id="screen"></div></main></div>
<footer class="footer"><span>ECTO OS // VISUAL FOUNDATION 002</span><span id="footerState">LOCAL DISPLAY PROFILE // CASSETTE FUTURISM</span></footer>
</div>
<script>
(()=>{
"use strict";
const KEY="ectoDisplayProfile";
const profiles={cassette:{label:"CASSETTE FUTURISM",theme:"cassette"},phosphor:{label:"PHOSPHOR GREEN",theme:"phosphor"},amber:{label:"AMBER",theme:"amber"},cyan:{label:"CYAN / TECHNICAL",theme:"cyan"}};
let profile=localStorage.getItem(KEY)||"cassette";
const teamsKey="ectoResponseTeams";
const defaultTeams=[{id:"ECHO-2",name:"ECHO RESPONSE",crew:6,status:"AVAILABLE"},{id:"ALPHA-1",name:"ALPHA RESPONSE",crew:6,status:"AVAILABLE"},{id:"DELTA-3",name:"DELTA SPECIALIST",crew:5,status:"STANDBY"},{id:"BRAVO-4",name:"BRAVO RESPONSE",crew:6,status:"DEPLOYED"}];
let teams=JSON.parse(localStorage.getItem(teamsKey)||"null")||defaultTeams;
function saveTeams(){localStorage.setItem(teamsKey,JSON.stringify(teams))}
const geo={
 countries:[
  {id:"GB",name:"United Kingdom",label:"COUNTRY"},
  {id:"US",name:"United States",label:"COUNTRY"}
 ],
 regions:[
  {id:"GB-HAM",countryId:"GB",name:"Hampshire",type:"county",label:"COUNTY"},
  {id:"GB-LON",countryId:"GB",name:"Greater London",type:"county",label:"REGION"},
  {id:"GB-WMD",countryId:"GB",name:"West Midlands",type:"county",label:"REGION"},
  {id:"GB-GMA",countryId:"GB",name:"Greater Manchester",type:"county",label:"REGION"},
  {id:"GB-SOW",countryId:"GB",name:"South West",type:"region",label:"REGION"},
  {id:"GB-SCT",countryId:"GB",name:"Scotland",type:"country-region",label:"NATION"},
  {id:"US-ME",countryId:"US",name:"Maine",type:"state",label:"STATE"}
 ],
 localities:[
  {id:"GB-HAM-POR",regionId:"GB-HAM",name:"Portsmouth",type:"city",x:54,y:66},
  {id:"GB-HAM-WIN",regionId:"GB-HAM",name:"Winchester",type:"city",x:53,y:62},
  {id:"GB-LON-LON",regionId:"GB-LON",name:"London",type:"city",x:67,y:70},
  {id:"GB-WMD-BHM",regionId:"GB-WMD",name:"Birmingham",type:"city",x:52,y:51},
  {id:"GB-GMA-MAN",regionId:"GB-GMA",name:"Manchester",type:"city",x:43,y:37},
  {id:"GB-SOW-BRI",regionId:"GB-SOW",name:"Bristol",type:"city",x:43,y:63},
  {id:"GB-SCT-EDI",regionId:"GB-SCT",name:"Edinburgh",type:"city",x:48,y:16},
  {id:"US-ME-ORD",regionId:"US-ME",name:"Ordinary",type:"town",x:58,y:40}
 ],
 sites:[
  {id:"SITE-0001",localityId:"GB-HAM-POR",name:"Historic Dockyard",grid:"C4-B-07",status:"ACTIVE",risk:"ELEVATED"},
  {id:"SITE-0002",localityId:"GB-HAM-POR",name:"Portsmouth Harbour Sector",grid:"C4-B-08",status:"MONITOR",risk:"NORMAL"},
  {id:"SITE-0003",localityId:"GB-HAM-WIN",name:"Winchester Sector",grid:"C4-C-03",status:"MONITOR",risk:"NORMAL"},
  {id:"SITE-0004",localityId:"GB-LON-LON",name:"Central London Sector",grid:"D4-A-01",status:"ACTIVE",risk:"NORMAL"},
  {id:"SITE-0005",localityId:"US-ME-ORD",name:"Ordinary Sector",grid:"US-ME-B-01",status:"MONITOR",risk:"ELEVATED"}
 ]
};
const teamsByRegion={"GB-HAM":["TEAM-ECHO-2","TEAM-GB-HAM"],"GB-LON":["TEAM-ALPHA-1"],"US-ME":["TEAM-US-ME"]};
const organisations=[
 {id:"TEAM-ECHO-2",name:"ECHO-2",regionIds:["GB-HAM"]},
 {id:"TEAM-GB-HAM",name:"GHOSTBUSTERS HAMPSHIRE",regionIds:["GB-HAM"]},
 {id:"TEAM-ALPHA-1",name:"ALPHA-1",regionIds:["GB-LON"]},
 {id:"TEAM-US-ME",name:"GHOSTBUSTERS MAINE",regionIds:["US-ME"]}
];
let mapState={level:"country",countryId:"GB",regionId:null,localityId:null,siteId:null};
let selectedSite=geo.sites[0];
function country(id){return geo.countries.find(x=>x.id===id)}
function region(id){return geo.regions.find(x=>x.id===id)}
function locality(id){return geo.localities.find(x=>x.id===id)}
function sitesForLocality(id){return geo.sites.filter(x=>x.localityId===id)}
function localitiesForRegion(id){return geo.localities.filter(x=>x.regionId===id)}
function regionsForCountry(id){return geo.regions.filter(x=>x.countryId===id)}
function teamsForRegion(id){return organisations.filter(x=>x.regionIds.includes(id))}
function setProfile(p){profile=p;document.body.dataset.theme=profiles[p].theme;localStorage.setItem(KEY,p);updateChrome();renderConfig()}
function updateChrome(){document.getElementById("profileStatus").textContent=profiles[profile].label;document.getElementById("footerState").textContent="LOCAL DISPLAY PROFILE // "+profiles[profile].label}
function setRoute(route){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.route===route));({map:renderMap,dispatch:renderDispatch,config:renderConfig}[route]||renderMap)()}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>setRoute(b.dataset.route));
function setMapLevel(level,id){if(level==="country"){mapState={level,countryId:id,regionId:null,localityId:null,siteId:null}}if(level==="region"){mapState={level,countryId:region(id).countryId,regionId:id,localityId:null,siteId:null}}if(level==="locality"){const l=locality(id);mapState={level,countryId:region(l.regionId).countryId,regionId:l.regionId,localityId:id,siteId:null}}if(level==="site"){const s=geo.sites.find(x=>x.id===id),l=locality(s.localityId);mapState={level,countryId:region(l.regionId).countryId,regionId:l.regionId,localityId:l.id,siteId:s.id};selectedSite=s}renderMap()}
function breadcrumbs(){const a=[`<button class="crumb ${mapState.level==='country'?'current':''}" onclick="setMapLevel('country','${mapState.countryId}')">${country(mapState.countryId).name}</button>`];if(mapState.regionId){const r=region(mapState.regionId);a.push(`<button class="crumb ${mapState.level==='region'?'current':''}" onclick="setMapLevel('region','${r.id}')">${r.name}</button>`)}if(mapState.localityId){const l=locality(mapState.localityId);a.push(`<button class="crumb ${mapState.level==='locality'?'current':''}" onclick="setMapLevel('locality','${l.id}')">${l.name}</button>`)}if(mapState.siteId){a.push(`<button class="crumb current">${selectedSite.name}</button>`)}return a.join("")}
function renderMap(){
 const title=mapState.level==="country"?country(mapState.countryId).name:mapState.level==="region"?region(mapState.regionId).name:mapState.level==="locality"?locality(mapState.localityId).name:selectedSite.name;
 const sub=mapState.level==="country"?"SELECT AN ADMINISTRATIVE REGION":mapState.level==="region"?"SELECT A CITY / TOWN":mapState.level==="locality"?"SELECT AN INVESTIGATION SITE":"SITE DATA / OPERATIONAL VIEW";
 document.getElementById("screen").innerHTML=`<div class="screen-head"><div><div class="eyebrow">01 // FIELD OVERVIEW</div><h1>RESPONSE MAP // ${title.toUpperCase()}</h1><div class="sub">COUNTRY → ADMINISTRATIVE REGION → LOCALITY → INVESTIGATION SITE</div></div><div class="status"><i class="lamp"></i>LOCAL NETWORK // READY</div></div><div class="notice">GEOGRAPHIC NAVIGATION is separate from TEAM identity. County, state, province and other administrative terms are data-driven rather than hard-coded.</div><div class="crumbs">${breadcrumbs()}</div><div class="grid"><section class="card"><h2>RESPONSE MAP <span class="panel-code">${sub}</span></h2><div class="map" id="map"></div></section><aside><section class="card"><h2>${sub}</h2><div id="drill"></div></section><section class="card" style="margin-top:12px"><h2>SELECTED DATA</h2><div id="details" class="readout"></div></section></aside></div>`;
 renderMapCanvas();renderDrill();renderDetails();
}
function renderMapCanvas(){const map=document.getElementById("map");if(!map)return;let points=[];if(mapState.level==="country")points=localitiesForRegion(regionsForCountry(mapState.countryId)[0].id).concat(...regionsForCountry(mapState.countryId).slice(1).map(r=>localitiesForRegion(r.id)));else if(mapState.level==="region")points=localitiesForRegion(mapState.regionId);else if(mapState.level==="locality"){const l=locality(mapState.localityId);points=[l]}else return;points.forEach(l=>{const b=document.createElement("button");const st=sitesForLocality(l.id);const critical=st.some(s=>s.risk==="CRITICAL");b.className="marker "+(critical?"alert":st.some(s=>s.status==="ACTIVE")?"active":"monitor");b.style.left=l.x+"%";b.style.top=l.y+"%";b.innerHTML=`<div class="ring"></div><div class="dot"></div><span>${l.name}</span>`;b.onclick=()=>setMapLevel("locality",l.id);map.appendChild(b)})}
function renderDrill(){const d=document.getElementById("drill");if(!d)return;let html="";if(mapState.level==="country"){regionsForCountry(mapState.countryId).forEach(r=>html+=`<button class="drill-item" onclick="setMapLevel('region','${r.id}')"><span><strong>${r.name}</strong><span>${r.label} // ${localitiesForRegion(r.id).length} LOCALITIES</span></span><b class="badge">OPEN</b></button>`)}else if(mapState.level==="region"){localitiesForRegion(mapState.regionId).forEach(l=>html+=`<button class="drill-item" onclick="setMapLevel('locality','${l.id}')"><span><strong>${l.name}</strong><span>${l.type.toUpperCase()} // ${sitesForLocality(l.id).length} SITES</span></span><b class="badge">OPEN</b></button>`)}else if(mapState.level==="locality"){sitesForLocality(mapState.localityId).forEach(s=>html+=`<button class="drill-item" onclick="setMapLevel('site','${s.id}')"><span><strong>${s.name}</strong><span>${s.grid} // ${s.status}</span></span><b class="badge">${s.risk}</b></button>`)}else{html=`<div class="readout"><div class="kv"><span class="k">SITE ID</span><span class="v">${selectedSite.id}</span></div><div class="kv"><span class="k">GRID</span><span class="v">${selectedSite.grid}</span></div><div class="kv"><span class="k">STATUS</span><span class="v">${selectedSite.status}</span></div></div><div class="actions"><button class="action btn-primary" onclick="setRoute('dispatch')">ECTO DISPATCH</button><button class="action" onclick="setMapLevel('locality','${mapState.localityId}')">BACK TO SITES</button></div>`}d.innerHTML=html}
function renderDetails(){const d=document.getElementById("details");if(!d)return;if(mapState.level==="country"){d.innerHTML=`<div class="kv"><span class="k">COUNTRY</span><span class="v">${country(mapState.countryId).name}</span></div><div class="kv"><span class="k">REGIONS</span><span class="v">${regionsForCountry(mapState.countryId).length}</span></div><div class="kv"><span class="k">MODEL</span><span class="v">INTERNATIONAL READY</span></div>`}else if(mapState.level==="region"){const r=region(mapState.regionId);d.innerHTML=`<div class="kv"><span class="k">REGION</span><span class="v">${r.name}</span></div><div class="kv"><span class="k">REGION TYPE</span><span class="v">${r.label}</span></div><div class="kv"><span class="k">LOCALITIES</span><span class="v">${localitiesForRegion(r.id).length}</span></div><div class="kv"><span class="k">REGISTERED TEAMS</span><span class="v">${teamsForRegion(r.id).length}</span></div>`}else if(mapState.level==="locality"){const l=locality(mapState.localityId),r=region(l.regionId);d.innerHTML=`<div class="kv"><span class="k">COUNTRY</span><span class="v">${country(r.countryId).name}</span></div><div class="kv"><span class="k">${r.label}</span><span class="v">${r.name}</span></div><div class="kv"><span class="k">LOCALITY</span><span class="v">${l.name}</span></div><div class="kv"><span class="k">TYPE</span><span class="v">${l.type.toUpperCase()}</span></div><div class="kv"><span class="k">SITES</span><span class="v">${sitesForLocality(l.id).length}</span></div><hr><div class="small-note">TEAM / ORGANISATION DATA IS INTENTIONALLY SEPARATE FROM GEOGRAPHY.</div>`}else{const l=locality(mapState.localityId),r=region(l.regionId);d.innerHTML=`<div class="kv"><span class="k">COUNTRY</span><span class="v">${country(r.countryId).name}</span></div><div class="kv"><span class="k">${r.label}</span><span class="v">${r.name}</span></div><div class="kv"><span class="k">LOCALITY</span><span class="v">${l.name}</span></div><div class="kv"><span class="k">SITE</span><span class="v">${selectedSite.name}</span></div><div class="kv"><span class="k">ECTO GRID</span><span class="v">${selectedSite.grid}</span></div><div class="kv"><span class="k">STATUS</span><span class="v">${selectedSite.status}</span></div><div class="kv"><span class="k">RISK</span><span class="v">${selectedSite.risk}</span></div>`}}
function renderDispatch(){document.getElementById("screen").innerHTML=`<div class="screen-head"><div><div class="eyebrow">02 // OPERATIONS</div><h1>ECTO DISPATCH</h1><div class="sub">SELECT TEAM → SELECT VEHICLE → PROCEED TO PRE-FLIGHT</div></div></div><div class="grid"><section class="card"><h2>INCOMING CASE</h2><div class="readout"><div class="kv"><span class="k">CASE</span><span class="v">SE-0261</span></div><div class="kv"><span class="k">LOCATION</span><span class="v">${locality(selectedSite.localityId).name}, ${region(locality(selectedSite.localityId).regionId).name}</span></div><div class="kv"><span class="k">SITE</span><span class="v">${selectedSite.name}</span></div><div class="kv"><span class="k">ECTO GRID</span><span class="v">${selectedSite.grid}</span></div><div class="kv"><span class="k">TYPE</span><span class="v">AWE</span></div></div></section><aside class="card"><h2>DEPLOYMENT SELECTION</h2><div class="field"><label>RESPONSE TEAM</label><select id="teamSelect">${teams.map(t=>`<option value="${t.id}" ${t.status!=="AVAILABLE"?"disabled":""}>${t.id} // ${t.name} // ${t.status}</option>`).join("")}</select></div><div class="field" style="margin-top:10px"><label>VEHICLE</label><select id="vehicleSelect"><option>ECTO-04 // AVAILABLE</option><option>ECTO-02 // AVAILABLE</option><option>ECTO-06 // STANDBY</option></select></div><button class="action btn-primary" style="width:100%;margin-top:10px" onclick="alert('Proceed to Pre-Flight // '+document.getElementById('teamSelect').value)">PROCEED TO PRE-FLIGHT</button></aside></div>`}
function renderConfig(){document.getElementById("screen").innerHTML=`<div class="screen-head"><div><div class="eyebrow">07 // SYSTEM CONTROL</div><h1>CONFIGURATION</h1><div class="sub">DISPLAY PROFILE // LOCATION ARCHITECTURE // RESPONSE RESOURCES</div></div></div><section class="card"><h2>DISPLAY PROFILE <span class="panel-code">PRIMARY INTERFACE LANGUAGE</span></h2><div class="notice"><b>CASSETTE FUTURISM</b> remains the primary visual identity. Display profiles change presentation only.</div><div class="profile-grid">${Object.entries(profiles).map(([id,x])=>`<button class="profile ${id} ${profile===id?'selected':''}" onclick="setProfile('${id}')"><i class="sample"></i><strong>${x.label}</strong><span>${id==='cassette'?'PRIMARY // RETROACTIVE MODERNISM':id==='phosphor'?'GREEN CRT // OPTIONAL':'OPTIONAL DISPLAY PROFILE'}</span></button>`).join("")}</div></section><div class="grid" style="margin-top:12px"><section class="card"><h2>RESPONSE TEAM MANAGEMENT <span class="panel-code">LOCAL REGISTER</span></h2><table class="team-table"><thead><tr><th>ID</th><th>NAME</th><th>CREW</th><th>STATUS</th><th></th></tr></thead><tbody>${teams.map((t,i)=>`<tr><td>${t.id}</td><td>${t.name}</td><td>${t.crew}</td><td>${t.status}</td><td><div class="team-actions"><button class="mini" onclick="editTeam(${i})">EDIT</button><button class="mini" onclick="deleteTeam(${i})">DELETE</button></div></td></tr>`).join("")}</tbody></table><hr><button class="action btn-primary" onclick="editTeam(-1)">+ NEW TEAM</button></section><aside class="card"><h2>GEOGRAPHIC ARCHITECTURE</h2><div class="readout"><div class="kv"><span class="k">LEVEL 01</span><span class="v">COUNTRY</span></div><div class="kv"><span class="k">LEVEL 02</span><span class="v">ADMINISTRATIVE REGION</span></div><div class="kv"><span class="k">LEVEL 03</span><span class="v">LOCALITY</span></div><div class="kv"><span class="k">LEVEL 04</span><span class="v">INVESTIGATION SITE</span></div><div class="kv"><span class="k">TEAM DATA</span><span class="v">SEPARATE / LINKED BY ID</span></div></div><hr><div class="small-note">COUNTY / STATE / PROVINCE / REGION IS STORED AS DATA, NOT AS A FIXED UI ASSUMPTION.</div></aside></div>`}
function editTeam(i){const t=i<0?{id:"",name:"",crew:6,status:"AVAILABLE"}:teams[i];const id=prompt("TEAM ID / CALLSIGN",t.id);if(id===null)return;const name=prompt("TEAM NAME",t.name);if(name===null)return;const crew=prompt("CREW SIZE",t.crew);if(crew===null)return;const status=prompt("STATUS",t.status);if(status===null)return;if(!id.trim()||teams.some((x,n)=>n!==i&&x.id.toUpperCase()===id.trim().toUpperCase())){alert("TEAM ID MUST BE UNIQUE");return}const rec={id:id.trim().toUpperCase(),name:name.trim().toUpperCase(),crew:Math.max(1,parseInt(crew)||6),status:status.trim().toUpperCase()};if(i<0)teams.push(rec);else teams[i]=rec;saveTeams();renderConfig()}
function deleteTeam(i){if(!["AVAILABLE","STANDBY","OFFLINE"].includes(teams[i].status)){alert("ACTIVE DEPLOYMENT CANNOT BE DELETED");return}if(confirm("DELETE "+teams[i].id+"?")){teams.splice(i,1);saveTeams();renderConfig()}}
window.setMapLevel=setMapLevel;window.setRoute=setRoute;window.setProfile=setProfile;window.editTeam=editTeam;window.deleteTeam=deleteTeam;
document.body.dataset.theme=profiles[profile].theme;updateChrome();setRoute("map");
})();
</script>
</body>
